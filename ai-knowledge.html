<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OneEvan AI</title>
</head>

<body>

    <h1>OneEvan AI</h1>

    <h3>Select Business</h3>

    <select id="businessList">
        <option value="">Select Business</option>
    </select>

    <br><br>

    <input
        type="text"
        id="businessName"
        placeholder="Business Name"
    >

    <button onclick="addBusiness()">
        + Add Business
    </button>


    <script>

        function addBusiness() {

            const name =
                document.getElementById("businessName").value.trim();

            if (!name) {
                alert("Business Name দিন");
                return;
            }

            const option =
                document.createElement("option");

            option.textContent = name;
            option.value = name;

            document
                .getElementById("businessList")
                .appendChild(option);

            document.getElementById("businessName").value = "";

            alert(name + " Added ✅");
        }

    </script>

</body>

</html>
