<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OneEvan AI - Knowledge</title>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }


        body{

            font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

            background:#f5f5f7;

            color:#111;

            min-height:100vh;

        }


        /* =========================
           HEADER
        ========================= */

        .header{

            height:70px;

            background:#090909;

            color:white;

            display:flex;

            align-items:center;

            justify-content:space-between;

            padding:0 25px;

        }


        .logo{

            display:flex;

            align-items:center;

            gap:10px;

            font-size:16px;

            font-weight:700;

        }


        .logo-icon{

            width:36px;

            height:36px;

            border-radius:10px;

            background:white;

            color:#111;

            display:flex;

            align-items:center;

            justify-content:center;

            font-weight:800;

        }


        .back-btn{

            border:0;

            background:white;

            color:#111;

            padding:9px 14px;

            border-radius:9px;

            cursor:pointer;

            font-size:11px;

        }


        /* =========================
           MAIN
        ========================= */

        .content{

            max-width:900px;

            margin:auto;

            padding:30px;

        }


        .page-title{

            margin-bottom:25px;

        }


        .page-title h1{

            font-size:27px;

            letter-spacing:-.5px;

        }


        .page-title p{

            color:#888;

            font-size:12px;

            margin-top:6px;

        }


        /* =========================
           BUSINESS
        ========================= */

        .business-box{

            background:white;

            border:1px solid #e5e5e5;

            border-radius:17px;

            padding:18px;

            margin-bottom:18px;

        }


        .business-box small{

            color:#999;

            font-size:10px;

        }


        .business-name{

            display:block;

            font-size:17px;

            margin-top:5px;

        }


        /* =========================
           CARD
        ========================= */

        .card{

            background:white;

            border:1px solid #e5e5e5;

            border-radius:18px;

            padding:22px;

        }


        .card-title{

            font-size:15px;

            margin-bottom:5px;

        }


        .card-subtitle{

            color:#999;

            font-size:10px;

            margin-bottom:20px;

        }


        /* =========================
           FORM
        ========================= */

        .form-group{

            margin-bottom:17px;

        }


        label{

            display:block;

            font-size:11px;

            font-weight:700;

            margin-bottom:7px;

        }


        textarea{

            width:100%;

            min-height:100px;

            border:1px solid #ddd;

            border-radius:11px;

            padding:12px;

            font-family:inherit;

            font-size:11px;

            outline:none;

            resize:vertical;

            background:#fafafa;

        }


        textarea:focus{

            border-color:#111;

            background:white;

        }


        /* =========================
           SAVE
        ========================= */

        .save-btn{

            width:100%;

            border:0;

            background:#111;

            color:white;

            padding:13px;

            border-radius:11px;

            cursor:pointer;

            font-size:11px;

            font-weight:600;

        }


        .save-btn:hover{

            background:#222;

        }


        .save-btn:disabled{

            opacity:.6;

            cursor:not-allowed;

        }


        .status{

            text-align:center;

            font-size:11px;

            margin-top:13px;

            min-height:18px;

        }


        .success{

            color:#1b8a4b;

        }


        .error{

            color:#d93025;

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px){

            .header{

                padding:0 15px;

            }


            .content{

                padding:18px;

            }


            .page-title h1{

                font-size:23px;

            }


            .card{

                padding:17px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


    <div class="logo">

        <div class="logo-icon">
            ✦
        </div>

        OneEvan AI

    </div>


    <button
        class="back-btn"
        onclick="goBack()">

        ← Dashboard

    </button>


</header>



<!-- =========================
     CONTENT
========================= -->

<main class="content">


    <div class="page-title">

        <h1>
            🧠 AI Knowledge
        </h1>

        <p>
            Teach your AI assistant about this business.
        </p>

    </div>



    <!-- BUSINESS -->

    <div class="business-box">

        <small>
            CURRENT BUSINESS
        </small>

        <span
            id="businessName"
            class="business-name">

            Loading...

        </span>

    </div>



    <!-- KNOWLEDGE FORM -->

    <div class="card">


        <h2 class="card-title">

            Business Information

        </h2>


        <p class="card-subtitle">

            এই তথ্যগুলো AI customer-এর প্রশ্নের উত্তর দেওয়ার সময় ব্যবহার করবে।

        </p>



        <!-- DESCRIPTION -->

        <div class="form-group">

            <label>
                Business Description
            </label>

            <textarea
                id="description"
                placeholder="যেমন: OneEvan একটি premium fashion brand যা বাংলাদেশে stylish clothing বিক্রি করে।">
            </textarea>

        </div>



        <!-- DELIVERY -->

        <div class="form-group">

            <label>
                Delivery Information
            </label>

            <textarea
                id="delivery"
                placeholder="যেমন: ঢাকা শহরে delivery 2-3 দিন। ঢাকার বাইরে 3-5 দিন। Delivery charge 100 টাকা।">
            </textarea>

        </div>



        <!-- PAYMENT -->

        <div class="form-group">

            <label>
                Payment Information
            </label>

            <textarea
                id="payment"
                placeholder="যেমন: Cash on Delivery, bKash, Nagad এবং Bank Payment available।">
            </textarea>

        </div>



        <!-- RETURN -->

        <div class="form-group">

            <label>
                Return / Exchange Policy
            </label>

            <textarea
                id="returnPolicy"
                placeholder="যেমন: Product পাওয়ার 3 দিনের মধ্যে exchange request করা যাবে।">
            </textarea>

        </div>



        <!-- AI RULES -->

        <div class="form-group">

            <label>
                Important AI Rules
            </label>

            <textarea
                id="aiRules"
                placeholder="যেমন: AI কোনো price বা product information অনুমান করবে না। তথ্য না থাকলে customer-কে support-এর সাথে যোগাযোগ করতে বলবে।">
            </textarea>

        </div>



        <!-- SAVE -->

        <button
            id="saveButton"
            class="save-btn"
            onclick="saveKnowledge()">

            💾 Save AI Knowledge

        </button>


        <div
            id="status"
            class="status">
        </div>


    </div>


</main>



<script>


/* =========================
   BUSINESS ID
========================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const businessId =
    urlParams.get("id");



/* =========================
   FIREBASE DATABASE
========================= */

const database =
    firebase.firestore();



/* =========================
   CHECK BUSINESS ID
========================= */

if(!businessId){

    document
    .getElementById("businessName")
    .textContent =
    "Business ID পাওয়া যায়নি ❌";

}



/* =========================
   LOAD BUSINESS
========================= */

async function loadBusiness(){

    if(!businessId){

        return;

    }


    try{

        const businessDoc =
            await database
            .collection("businesses")
            .doc(businessId)
            .get();


        if(!businessDoc.exists){

            document
            .getElementById("businessName")
            .textContent =
            "Business পাওয়া যায়নি ❌";

            return;

        }


        const businessData =
            businessDoc.data();


        document
        .getElementById("businessName")
        .textContent =
        businessData.name;


        loadKnowledge();

    }

    catch(error){

        console.error(error);


        document
        .getElementById("businessName")
        .textContent =
        "Error loading business ❌";

    }

}



/* =========================
   LOAD KNOWLEDGE
========================= */

async function loadKnowledge(){

    try{

        const knowledgeDoc =
            await database

            .collection("businesses")

            .doc(businessId)

            .collection("aiKnowledge")

            .doc("main")

            .get();


        if(!knowledgeDoc.exists){

            return;

        }


        const data =
            knowledgeDoc.data();


        document
        .getElementById("description")
        .value =
        data.description || "";


        document
        .getElementById("delivery")
        .value =
        data.delivery || "";


        document
        .getElementById("payment")
        .value =
        data.payment || "";


        document
        .getElementById("returnPolicy")
        .value =
        data.returnPolicy || "";


        document
        .getElementById("aiRules")
        .value =
        data.aiRules || "";

    }

    catch(error){

        console.error(error);

    }

}



/* =========================
   SAVE KNOWLEDGE
========================= */

async function saveKnowledge(){

    if(!businessId){

        showStatus(
            "Business ID পাওয়া যায়নি ❌",
            "error"
        );

        return;

    }


    const saveButton =
        document
        .getElementById("saveButton");


    saveButton.disabled = true;

    saveButton.textContent =
        "Saving...";


    const knowledge = {

        description:
        document
        .getElementById("description")
        .value
        .trim(),


        delivery:
        document
        .getElementById("delivery")
        .value
        .trim(),


        payment:
        document
        .getElementById("payment")
        .value
        .trim(),


        returnPolicy:
        document
        .getElementById("returnPolicy")
        .value
        .trim(),


        aiRules:
        document
        .getElementById("aiRules")
        .value
        .trim(),


        updatedAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    };


    try{

        await database

        .collection("businesses")

        .doc(businessId)

        .collection("aiKnowledge")

        .doc("main")

        .set(
            knowledge,
            {
                merge:true
            }
        );


        showStatus(
            "✅ AI Knowledge Saved Successfully!",
            "success"
        );

    }

    catch(error){

        console.error(error);


        showStatus(
            "❌ Save হয়নি: " +
            error.message,
            "error"
        );

    }


    saveButton.disabled = false;

    saveButton.textContent =
        "💾 Save AI Knowledge";

}



/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
){

    const status =
        document
        .getElementById("status");


    status.textContent =
        message;


    status.className =
        "status " +
        type;

}



/* =========================
   BACK
========================= */

function goBack(){

    window.location.href =
        "business.html?id=" +
        businessId;

}



/* =========================
   START
========================= */

loadBusiness();


</script>


</body>

</html>
